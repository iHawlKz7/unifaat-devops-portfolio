name: Terraform Plan - Aula 10

on:
  pull_request:
    branches:
      - main
    paths:
      - 'aula-10/terraform/**'
      - '.github/workflows/terraform-plan-aula10.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: aula-10/terraform

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS do Learner Lab
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.0'

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false > plan.txt 2>&1
          EXIT_CODE=$?
          cat plan.txt
          echo "exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comentar plan no Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: aula-10/terraform/plan.txt
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- aula10-terraform-plan -->';
            const raw = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const plan = raw.length > 60000
              ? `${raw.slice(0, 60000)}\n\n[output truncado]`
              : raw;
            const status = process.env.PLAN_EXIT_CODE === '0'
              ? '✅ SUCESSO'
              : '❌ FALHA';

            const body = `${marker}
            ## Terraform Plan — Aula 10

            **Status:** ${status}

            <details>
            <summary>Ver terraform plan</summary>

            \`\`\`text
            ${plan}
            \`\`\`

            </details>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Falhar se Terraform Plan falhou
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
