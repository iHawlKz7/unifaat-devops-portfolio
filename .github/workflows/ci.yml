name: CI - Aula 09

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/technova-api

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aula-09/technova-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-09/technova-api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint
        run: npm run lint


  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aula-09/technova-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-09/technova-api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm run test:ci

      - name: Publicar coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aula-09
          path: aula-09/technova-api/coverage/
          retention-days: 14


  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: aula-09/technova-api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
